<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="1200" height="320" fill="none">
  <defs>
    <linearGradient id="cream-lockup-bg" x1="0" y1="0" x2="600" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCFAF6" />
      <stop offset="100%" stop-color="#F5F0E6" />
    </linearGradient>
    <linearGradient id="cream-badge-border" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D8CDBA" />
      <stop offset="100%" stop-color="#BEB09A" />
    </linearGradient>
  </defs>

  <!-- Cream Canvas -->
  <rect width="600" height="160" rx="16" fill="url(#cream-lockup-bg)" stroke="#E5DAC7" stroke-width="1.5" />

  <!-- Dark Icon Badge on Cream Background -->
  <g transform="translate(35, 30)">
    <rect width="100" height="100" rx="22" fill="#0E0C0A" stroke="#2D261E" stroke-width="1.5" />
    <g transform="translate(15, 15) scale(0.7)">
      <rect x="50" y="16" width="34" height="18" rx="4" fill="#FFFFFF" />
      <rect x="16" y="16" width="28" height="18" rx="4" fill="#FFFFFF" />
      <rect x="16" y="38" width="28" height="24" rx="4" fill="#FFFFFF" />
      <rect x="16" y="66" width="28" height="18" rx="4" fill="#FFFFFF" />
      <rect x="50" y="66" width="34" height="18" rx="4" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Dark Brand Typography -->
  <text x="160" y="85" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="#0E0C0A">Credence</text>
  <text x="162" y="112" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#786B58">PRIVACY-PRESERVING CORPORATE CREDIT PROTOCOL</text>
</svg>
